services:
  postgres:
    image: postgres:16-alpine
    container_name: estera_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-estera}
      POSTGRES_USER: ${POSTGRES_USER:-estera_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-estera_app} -d ${POSTGRES_DB:-estera}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - estera_internal

  redis:
    image: redis:7-alpine
    container_name: estera_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - estera_internal

  minio:
    image: minio/minio:latest
    container_name: estera_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-estera_storage}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      - estera_internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: estera_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-estera}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-estera_app}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      PAYMENT_MODE: ${PAYMENT_MODE:-TEST}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-estera_storage}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - estera_internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: estera_frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: https://api.${DOMAIN_NAME:-est-era.uz}
      NEXT_PUBLIC_WS_URL: wss://api.${DOMAIN_NAME:-est-era.uz}/ws
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - estera_internal

  nginx:
    image: nginx:1.27-alpine
    container_name: estera_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - estera_internal

volumes:
  pg_data:
  redis_data:
  minio_data:
  certbot_www:
  certbot_conf:

networks:
  estera_internal:
    driver: bridge
